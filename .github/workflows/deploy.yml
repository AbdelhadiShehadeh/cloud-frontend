# Builds the frontend Docker image and pushes it to GitHub Container Registry (ghcr.io).
# Digital Ocean App Platform is configured to pull from GHCR and redeploys automatically
# when a new image is pushed.

name: Build and Deploy Frontend

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".gitignore"
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/cloud-frontend
          IMAGE=${IMAGE,,}
          docker build \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            -t ${IMAGE}:latest \
            -t ${IMAGE}:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/cloud-frontend
          IMAGE=${IMAGE,,}
          docker push ${IMAGE}:latest
          docker push ${IMAGE}:${{ github.sha }}

  deploy:
    name: Deploy to Digital Ocean
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Trigger App Platform deployment
        run: doctl apps create-deployment ${{ secrets.DIGITALOCEAN_APP_ID }}
